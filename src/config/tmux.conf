# Change prefix from default Ctrl+b to Ctrl+a (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
# Enable full mouse support (clicking, resizing, scrolling)
set -g mouse on
# Start window and pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use intuitive keys for splitting panes and keep current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# Kill current session with Prefix + X
bind x confirm-before -p "kill-session #S? (y/n)" kill-session

# Enable vim keybindings for navigating copy/scroll mode
set-window-option -g mode-keys vi

# Quick reload configuration shortcut (Prefix + r)
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Increase scrollback buffer history
set -g history-limit 50000

# Prevent tmux from clearing the screen when exiting programs like less/man
set-window-option -g alternate-screen off
# Ensure TrueColor (24-bit color) support inside tmux
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"
# Interactive session switcher using fzf (Bound to Prefix + C-j)
# Interaktif fzf untuk switch sesi atau buat sesi baru (Prefix + C-j)
bind C-j display-popup -E "\
    session=\$((\
        echo '✨ [Create New Session]'; \
        tmux list-sessions -F '#{session_name}'\
    ) | fzf --reverse --header 'Manage Sessions' --border=rounded); \
    if [ \"\$session\" = '✨ [Create New Session]' ]; then \
        echo -n 'Nama sesi baru: '; \
        read new_name; \
        [ -n \"\$new_name\" ] && tmux new-session -d -s \"\$new_name\" && tmux switch-client -t \"\$new_name\"; \
    elif [ -n \"\$session\" ]; then \
        tmux switch-client -t \"\$session\"; \
    fi"
